onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[theme]
name = "catppuccin"

[ui]
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[[keys.command]]
key = "prefix+alt+z"
type = "popup"
command = "herdr-zdiff"
description = "review uncommitted changes"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "herdr-zdiff main"
description = "review changes against main"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+alt+n"
type = "popup"
command = "nvim"
description = "open LazyVim"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "herdr-agent codex"
description = "run Codex"

[[keys.command]]
key = "prefix+alt+a"
type = "pane"
command = "herdr-agent claude"
description = "run Claude Code"

[[keys.command]]
key = "prefix+alt+m"
type = "pane"
command = "herdr-ccglm"
description = "run GLM"
